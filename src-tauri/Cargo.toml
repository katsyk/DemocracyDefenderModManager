[package]
name = "ddmm"
version = "2.0.0-rc.5"
description = "Democracy Defender Mod Manager — a source-neutral mod manager for Helldivers 2."
authors = ["katsyk"]
edition = "2021"

[lib]
name = "ddmm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-prevent-default = "5"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
uuid = { version = "1.23", features = ["serde", "v4"] }
tokio = { version = "1.52", features = ["fs", "net", "io-util", "io-std", "sync", "time", "process", "rt-multi-thread", "macros"] }
anyhow = "1.0"
# `show_errs_in_release`: without it every command error reaches the UI as
# "errors disabled in production." in release builds, hiding the real cause.
anyhow-tauri = { version = "1.0", features = ["show_errs_in_release"] }
zip = "8.5"
sevenz-rust2 = { version = "0.23", features = ["util"] }
unrar = "0.5"
tauri-plugin-dialog = "2.7"
futures = "0.3"
regex = "1.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
percent-encoding = "2.3.2"
dirs = "7"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
url = "2.5"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
