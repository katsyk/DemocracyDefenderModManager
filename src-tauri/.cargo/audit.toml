# cargo-audit configuration. Read by `cargo audit` when run from src-tauri/
# (ci.yml and local runs). The rustsec/audit-check action runs from the repo
# root and does not see this file, so audit.yml and build.yml pass the same IDs
# through the action's `ignore:` input -- keep all three lists in sync.
#
# Only advisories with no fix reachable on Tauri 2 (its GTK3 / webkit2gtk-4.1
# stack on Linux, and the zbus 5 its plugins use) are listed here. Anything
# new still fails / opens an issue.

[advisories]
ignore = [
    # proc-macro-error 1.0.4 is unmaintained. Build-time only: a proc-macro
    # dependency of glib-macros 0.18 and gtk3-macros 0.18 (gtk-rs GTK3
    # bindings used by tauri/wry/tao/muda on Linux). gtk-rs dropped it in
    # 0.19+, which is GTK4-only; there is no 0.18.x without it. Remove once
    # Tauri moves off gtk-rs 0.18.
    "RUSTSEC-2024-0370",

    # glib 0.18.5: unsound Iterator impls for glib::VariantStrIter (fixed in
    # glib >= 0.20; no patched 0.18.x release exists). glib 0.18 is pinned by
    # gtk 0.18 / webkit2gtk 2.0 via tauri, wry, tao and muda on Linux. Neither
    # DDMM nor any crate in our dependency tree calls VariantStrIter /
    # Variant::array_iter_str (only glib's own definition and unit tests
    # reference it), so the unsound code path is not reachable.
    "RUSTSEC-2024-0429",

    # zvariant, zbus_names and zvariant_derive are "unmaintained" only
    # because zbus 6 absorbed them (as zbus::wire, zbus::names and zbus's own
    # derives); no vulnerability is reported. Two copies are in Cargo.lock:
    # - 5.15 / 4.3.4 via zbus 5.19, used on Linux by tauri-plugin-opener and
    #   tauri-plugin-single-instance. No published version of either, 3.0
    #   alphas included, uses zbus 6 yet: all of them require zbus ^5.9.
    # - 4.2 / 3.0 via zbus 4.4, via secret-service 4, an optional dependency
    #   of keyring 3.6.3 behind its `async-secret-service` feature. DDMM uses
    #   `sync-secret-service` (dbus-secret-service, no zbus), so this copy is
    #   in the lockfile but never compiled (`cargo tree -i zbus@4.4.0 --target
    #   all` prints nothing). keyring 3.6.3 is the last 3.x; 4.x is a rewrite.
    # Remove once the plugins (and keyring) move to zbus 6.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive
]
