name: Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y ${{ env.LINUX_DEPS }}

      - name: Install frontend dependencies
        run: pnpm install

      # `cargo test` alone already skips #[ignore]d tests (the live-network
      # ones) -- that's the default, not a flag we need to pass.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Cargo.lock is a single, platform-independent resolution, so auditing
      # it once (not once per matrix OS) is enough.
      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: i18n check
        run: pnpm run scan:i18n

      - name: Frontend build
        run: pnpm run build

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build
        run: pnpm tauri build
        env:
          # Public Nexus Mods OAuth client ID for "Sign in to Nexus Mods",
          # from the repository variable of the same name (Settings ->
          # Secrets and variables -> Actions -> Variables). Not a secret.
          # Unset -> empty -> sign-in shows "Coming soon"; the build never
          # fails over it.
          DDMM_NEXUS_CLIENT_ID: ${{ vars.DDMM_NEXUS_CLIENT_ID }}

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Rename NSIS setup installer
        shell: bash
        run: |
          set -euo pipefail
          src=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          cp "$src" "DDMM-${{ steps.version.outputs.version }}-windows-x64-setup.exe"

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/ddmm.exe portable/
          Copy-Item packaging/portable.txt portable/
          Copy-Item packaging/QUICKSTART.txt portable/
          Compress-Archive -Path portable/* -DestinationPath "DDMM-$version-windows-x64-portable.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            DDMM-*-windows-x64-setup.exe
            DDMM-*-windows-x64-portable.zip
          if-no-files-found: error

  build-linux:
    needs: test
    # Oldest supported Ubuntu LTS on purpose: the binary requires the build
    # host's glibc or newer, and 24.04's (2.39) locked out Ubuntu 22.04,
    # Debian 12 and Mint 21. Verified by linux-distros.yml.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Separate from the ubuntu-latest caches: restoring a 24.04
          # target/ dir on 22.04 breaks the build ("can't find crate").
          key: ubuntu-22.04

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y ${{ env.LINUX_DEPS }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build
        run: pnpm tauri build
        env:
          # Public Nexus Mods OAuth client ID for "Sign in to Nexus Mods",
          # from the repository variable of the same name (Settings ->
          # Secrets and variables -> Actions -> Variables). Not a secret.
          # Unset -> empty -> sign-in shows "Coming soon"; the build never
          # fails over it.
          DDMM_NEXUS_CLIENT_ID: ${{ vars.DDMM_NEXUS_CLIENT_ID }}

      - name: Determine version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Rename AppImage, deb and rpm
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          cp "$appimage" "DDMM-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          # Drop the bundled libwayland/libxkbcommon/libxcb-* that break EGL on
          # newer Mesa (Fedora 44); see the script and linux-distros.yml.
          bash scripts/ci/fix-appimage.sh "DDMM-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          cp "$deb" "DDMM-${{ steps.version.outputs.version }}-linux-amd64.deb"
          rpm=$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -n1)
          cp "$rpm" "DDMM-${{ steps.version.outputs.version }}-linux-x86_64.rpm"

      - name: Build tar.gz (binary + QUICKSTART.txt)
        run: |
          set -euo pipefail
          mkdir -p tarball
          cp src-tauri/target/release/ddmm tarball/
          cp packaging/QUICKSTART.txt tarball/
          tar -C tarball -czf "DDMM-${{ steps.version.outputs.version }}-linux-x64.tar.gz" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            DDMM-*-linux-x86_64.AppImage
            DDMM-*-linux-amd64.deb
            DDMM-*-linux-x86_64.rpm
            DDMM-*-linux-x64.tar.gz
          if-no-files-found: error

  build-extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # extension/ is a standalone package (its own lockfile) -- see
      # extension/README.md -- so this installs and builds from inside it.
      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build extension
        working-directory: extension
        # The pinned Chrome extension id comes from the committed PUBLIC key
        # in extension/chrome-public-key.txt (see scripts/build.mjs).
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: extension/dist/ddmm-extension-*.zip
          if-no-files-found: error

  # Gate: smoke-test exactly the Linux files built above in Fedora, Arch,
  # Ubuntu, Debian and openSUSE containers (see linux-distros.yml). Reuses
  # the linux-build artifact, so nothing is rebuilt. release needs this, so a
  # tag can never publish Linux files that failed the matrix.
  linux-distros:
    needs: build-linux
    uses: ./.github/workflows/linux-distros.yml
    with:
      artifact: linux-build

  release:
    needs: [build-windows, build-linux, build-extension, linux-distros]
    # Only a tag push publishes. A workflow_dispatch run (on a branch, or
    # even on a tag ref) builds and tests everything but never releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine and verify version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          config_version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$version" != "$config_version" ]; then
            echo "::error::tag version ($version) does not match tauri.conf.json version ($config_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check release notes exist
        run: |
          set -euo pipefail
          notes=".github/release-notes/${{ steps.version.outputs.tag }}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing release notes file $notes"
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "DDMM ${{ steps.version.outputs.version }}"
          body_path: .github/release-notes/${{ steps.version.outputs.tag }}.md
          draft: false
          prerelease: true
          files: release/*
